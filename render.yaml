# Démo publique (branche demo) : API Strapi sur Render free, base PostgreSQL sur Neon free.
services:
  - type: web
    name: patrimoine-hebdo-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: demo
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "1337"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      # Chaîne de connexion Neon (avec ?sslmode=require), à coller dans le dashboard Render
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # 0 connexion au repos : Neon peut mettre la base en veille et préserver le quota gratuit
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SEED_DEMO_DATA
        value: "true"
      # Mot de passe commun des comptes de démo
      - key: SEED_USER_PASSWORD
        sync: false
